<style>
  .form-group { margin-bottom: 15px; }
  label { display: block; margin-bottom: 5px; font-weight: bold; }
  input { width: 100%; padding: 8px; box-sizing: border-box; }
  .button { background-color: #000; color: #fff; padding: 10px; text-align: center; border-radius: 5px; cursor: pointer; }
</style>

<div class="form-group">
  <label for="username" data-i18n="pair.username"></label>
  <input type="text" id="username" placeholder="you@example.com" autocomplete="username" />
</div>
<div class="form-group">
  <label for="password" data-i18n="pair.password"></label>
  <input type="password" id="password" autocomplete="current-password" />
</div>
<div class="button" id="login" data-i18n="pair.add_battery"></div>

<script>
  document.getElementById('login').addEventListener('click', function () {
    var username = document.getElementById('username').value.trim();
    var password = document.getElementById('password').value;
    Homey.showLoadingOverlay();
    Homey.emit('login', { username: username, password: password }, function (err, device) {
      Homey.hideLoadingOverlay();
      if (err) return Homey.alert(err.message || err);
      Homey.createDevice(device, function (err) {
        if (err) return Homey.alert(err.message || err);
        Homey.done();
      });
    });
  });
</script>
